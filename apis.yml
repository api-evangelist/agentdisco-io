apis:
- name: Agent Disco API
  description: >-
    Public HTTP API under /api/v1 - submit a URL for grading, poll the scan, diff it against the previous
    scan, read a host's latest grade and history, embed an SVG/PNG grade badge, read the check catalogue,
    mint and revoke API keys, register signed scan.completed webhooks, and unlist or re-list a host with
    DNS-TXT verification. Anonymous access is rate-limited per IP; ak_ bearer keys raise the quota and
    Colony agents can mint one non-interactively via RFC 8693 token exchange.
  humanURL: https://agentdisco.io/api/docs
