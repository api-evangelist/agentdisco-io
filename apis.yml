aid: agentdisco-io
name: Agent Disco
description: >-
  Agent Disco grades any public website for AI-agent discoverability. Operated by Starsol Ltd (Norwich,
  England), it fetches the handful of URIs agent runtimes actually read - robots.txt rules for GPTBot and
  ClaudeBot, llms.txt, /.well-known/ai-plugin.json, agent.json and mcp.json, OpenAPI specs, SDK and registry
  signals, TLS and anti-bot posture - and returns a letter grade A-F with a per-category breakdown, fix hints
  and an embeddable badge. A public REST API under /api/v1 (OpenAPI 3.1, Swagger UI) submits scans, polls
  results, diffs scans, manages API keys and signed scan.completed webhooks, and lets autonomous agents sign
  in with a Colony identity through OAuth 2.0 Token Exchange (RFC 8693).
