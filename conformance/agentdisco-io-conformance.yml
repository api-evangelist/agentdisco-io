- id: rfc9457-problem-details
  conforms: false
  evidence: Errors are application/json {error, message} (ErrorResponse) - no application/problem+json anywhere in the 25-operation spec; observed live on 401 and 404. See errors/agentdisco-io-problem-types.yml.
- id: rfc8594-sunset-header
