data_retention:
  source: https://agentdisco.io/privacy
  scan_records: Pruned automatically after 90 days, with one most-recent scan retained per host to keep embedded badges valid.
  ip_addresses: Application logs held 30 days, then purged.
  server_access_logs: 30 days.
  account_activity_log: 90 days; removed immediately if the account is deleted.
  right_to_delete: DELETE /api/v1/websites/{host} removes the host and every scan and finding under it (204).
operational_cadence:
  badge_staleness: Badge fades to grey after 30 days (agent_disco.badge_stale_days); returns 410 with ?strict=1.
  nightly_rescan: A nightly job rescans a small batch of hosts whose badge has gone stale (typically older than 30 days); no background crawler.
  webhook_delivery: 2xx expected within 10 seconds; 3 retries with exponential backoff; auto-pause after 5 consecutive terminal failures; counter resets on any 2xx.
  unlist_token_validity: 86400 seconds (expires_in_seconds example).
